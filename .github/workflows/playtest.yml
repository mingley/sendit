name: Desktop playtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playtest.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'maps/**'
      - 'scripts/playtest-desktop.py'

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '3'
      RUST_CACHE_PATHS: |
        ~/.cargo/registry
        target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install graphics, audio and desktop test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-x11-0 libvulkan1 xvfb x11-utils libxtst6 tesseract-ocr-eng mesa-vulkan-drivers python3-pil python3-numpy
      - id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUST_CACHE_PATHS }}
          key: ubuntu24-play-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the game
        run: cargo build --locked --release --workspace
      - name: Cache compiled dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUST_CACHE_PATHS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Run workspace tests
        run: cargo test --locked --release --workspace
      - name: Test the arsenal over UDP
        run: target/release/sendit-probe verify-arsenal --server target/release/sendit-server
      - name: Play the desktop release with mouse and keyboard
        env:
          WGPU_BACKEND: vulkan
        run: /usr/bin/python3 scripts/playtest-desktop.py --bin-dir target/release --output-dir playtest
      - name: Save screenshots, recordings and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-playtest
          path: playtest
          if-no-files-found: ignore
