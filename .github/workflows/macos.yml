name: Apple Silicon game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'maps/**'
      - 'scripts/package*.py'
      - 'scripts/smoke-macos.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the native toolchain
        run: |
          test "$(uname -m)" = arm64
          rustc -vV
          xcrun --sdk macosx --show-sdk-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-15-arm64-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build and sign Sendit.app
        run: python3 scripts/package_release.py --platform macos --target aarch64-apple-darwin --out dist
      - name: Test on Apple Silicon
        run: cargo test --release --locked --workspace --target aarch64-apple-darwin
      - name: Playtest the extracted download
        run: python3 scripts/smoke-macos.py dist/sendit-macos-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sendit-macos-arm64
          path: |
            dist/sendit-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
