name: Apple Silicon game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'maps/**'
      - 'scripts/package*.py'
      - 'scripts/smoke-macos.py'
      - 'scripts/playtest-macos.swift'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '3'
      RUST_CACHE_PATHS: |
        ~/.cargo/registry
        target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check the native toolchain
        run: |
          test "$(uname -m)" = arm64
          rustc -vV
          xcrun --sdk macosx --show-sdk-version
      - id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUST_CACHE_PATHS }}
          key: macos-15-arm64-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build and sign Sendit.app
        id: package
        run: python3 scripts/package_release.py --platform macos --target aarch64-apple-darwin --out dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sendit-macos-arm64
          path: |
            dist/sendit-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - name: Cache compiled dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUST_CACHE_PATHS }}
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Test on Apple Silicon
        run: cargo test --release --locked --workspace --target aarch64-apple-darwin
      - name: Playtest the extracted download
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python3 scripts/smoke-macos.py dist/sendit-macos-arm64.zip --output-dir macos-playtest
      - name: Save the native playtest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-silicon-playtest
          path: macos-playtest
          if-no-files-found: ignore
