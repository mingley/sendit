[package]
name = "sendit-client"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { version = "0.15.3", default-features = false, features = ["bevy_asset", "bevy_audio", "wav", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_ui", "bevy_text", "default_font", "multi_threaded", "x11"] }
sendit-sim = { path = "../sim" }
sendit-server = { path = "../server" }
serde_json = "1"

[dev-dependencies]
rodio = { version = "0.19", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
